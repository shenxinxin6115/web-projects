<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS字体属性</title>
    <style>
        #fifth-div{
            font-family: "Times New Roman",SimHei,serif;
        }
        #sixth-div{
            font-style:italic;
        }
        #seventh-div{
            font-weight: bold;
            font-size: 40px;
            font-family: "Times New Roman",SimHei,serif;
            font-style:italic;
        }

    </style>
</head>
<body>
    <h1>CSS字体属性</h1>
    <div id="fifth-div">
        <p>字体族: "Times New Roman", SimHei, serif</p>
    </div>
    <div id="sixth-div">
        <p>斜体</p>
    </div>
    <div id="seventh-div">
        <p>字体粗细</p>
    </div>
</body>
</html>
