<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS长度单位</title>
</head>
<body>
    <div class="div-px">像素(px)
        <span style="font-size: 50px;">大小设置</span>
    </div>
    <div class="div-em">倍数(em)
        <span style="font-size: 2em;">大小设置</span>
    </div>
    <div class="div-rem">相对像素(rem)
        <span style="font-size: 2rem;">大小设置</span>
    </div>
    <div class="div-%">百分比(%)
        <span style="font-size: 200%;">大小设置</span>
    </div>

</body>
</html>
