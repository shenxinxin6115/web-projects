<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS文本属性</title>
    <style>
        *{
            font-size: 30px;
            font-family: "Times New Roman",SimHei,serif;
        }
        .div-color{
            color: rgb(52, 159, 163);
            letter-spacing: 10px;
            word-spacing: 10px;
            text-decoration: underline;
            text-indent: 100px;
            text-align: center;
            /* 也可以数字：参考自身 font-size 的倍数：1.5、2、3、4、5、6、7、8、9、10 ；百分比：参考自身 font-size 的百分比。*/
            line-height: 500px; 
            height: 500px;
        }
    </style>
</head>
<body>
    <div class="div-color">
        <span>这是一个文本示例:This is a text demonstration</span>
    </div>
</body>
</html>
