<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS元素显示模式</title>
</head>
<body>
    <!-- 块元素(block) -->
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <h3>三级标题....</h3>
    <hr>
    <p>段落元素</p>
    <pre>预格式化文本</pre>
    <div>块级元素</div>
    <form>
        <input type="text" placeholder="输入框">
        <button>按钮</button>
    </form>
    <option>下拉选项</option>
    <!-- 行内元素 -->
    <span>行内元素</span>
    <a href="#">链接元素</a>
    <br>
    <em>斜体元素</em>
    <strong>加粗元素</strong>
    <sup>上标元素</sup>
    <sub>下标元素</sub>
    <del>删除线元素</del>
    <ins>下划线元素</ins>
    <label>标签元素</label>
    <!-- 行内块元素 -->
    <img src="https://www.w3school.com.cn/i/eg_tulip.jpg" alt="图片元素">
    <td>表格单元格元素</td>
    <th>表格表头单元格元素</th>
    <input type="text" placeholder="输入框">
    <textarea placeholder="文本域"></textarea>
    <select>
        <option>下拉列表元素</option>
    </select>
    <button>按钮元素</button>
    <iframe src="https://www.w3school.com.cn" title="iframe元素"></iframe>
</body>
</html>
