<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>常用标前补充</title>
</head>

<body>
    <h3>强制换行</h3>
    <p>这是第一行。<br>这是第二行。<br>这是第三行。</p>
    <h3>水平线</h3>
    <p>这是第一行。</p>
    <hr>
    <p>这是第二行。</p>
    <h3>空格</h3>
    <p>这是第一行。&nbsp;&nbsp;&nbsp;这是第二行。</p>
    <h3>按原文显示</h3>
    <pre>
        def hello():
            print("Hello, World!")
    </pre>
</body>
</html>
