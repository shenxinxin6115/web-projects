<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>列表</title>
</head>
<body>
    <h2>有序列表</h2>
    <ol>
        <li>有序列表项1</li>
        <li>有序列表项2</li>
        <li>有序列表项3</li>
        <li>
            <a href="https://www.example.com" target="_blank">链接</a>
        </li>
    </ol>
    <h2>无序列表</h2>
    <ul>
        <li>无序列表项1</li>
        <li>
            <span>上海</span>
            <ul>
                <li>
                    <span>浦东新区</span>
                    <ul>
                        <li>陆家嘴</li>
                        <li>张江高科</li>
                        <li>外高桥</li>
                    </ul>
                    <li>陆家嘴</li>
                    <li>张江高科</li>
                    <li>外高桥</li>
                </li>
                <li>徐汇区</li>
                <li>黄浦区</li>
            </ul>
        </li>
        <li>无序列表项2</li>
        <li>无序列表项3</li>
    </ul>
    <h2>自定义列表</h2>
    <dl>
        <dt>做好笔记</dt>
        <dd>笔记是我们复习的一个抓手</dd>
        <dd>笔记可以是电子版也可以是纸质版</dd>
        <dt>制定学习计划</dt>
        <dd>学习计划帮助我们有条不紊地进行学习</dd>
        <dt>定期复习</dt>
        <dd>定期复习可以巩固我们的记忆</dd>
    </dl>
</body>
</html>
