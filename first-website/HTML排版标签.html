<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML排版标签</title>
</head>
<body>
    <!-- h1~h6标签：用于定义标题，h1表示最高级别的标题，h6表示最低级别的标题。 -->
    <h1>这是h1标题</h1>
    <h2>这是h2标题</h2>
    <h3>这是h3标题</h3>
    <h4>这是h4标题</h4>
    <h5>这是h5标题</h5>
    <h6>这是h6标题</h6>
    <p><em>em标签：用于强调文本，通常会以斜体显示。</em></p>
    <p>测试：加粗<strong>strong标签：用于定义加粗文本。 </strong></p>
    <img src="images/first-icon.png" alt="首图标" width="300" height="300"/>
    <p><input type="text"  value="这是一个输入框" /></p>
    <p><input type="text" disabled="" value="这是一个禁用的输入框"/></p>
    <p><strong><a href="https://www.baidu.com" target="_blank">百度</a></strong></p>
    <a href="https://www.example.com" title="一个&quot;有趣&quot;的引用">一个指向示例的链接。</a>
    <p id="noWhitespace">狗狗很 呆 萌。</p>

    <p id="whitespace">狗狗很
        呆
            萌。</p>
    <p>HTML 中用 &lt;p&gt; 来定义段落元素</p>
</body>
</html>
