<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>常用标前补充</title>
</head>

<body>
    <!-- 1. 普通文字与 <br> 的效果 -->
    <h3>1. br 标签示例（强制换行）</h3>
    <p>
        床前明月光，<br>
        疑是地上霜。<br>
        举头望明月，<br>
        低头思故乡。
    </p>

    <!-- 2. <hr> 的效果：画一条横贯页面的水平分割线 -->
    <hr>

    <!-- 3. 普通文本 vs <pre> 的区别 -->
    <h3>2. 普通标签 vs pre 标签对比</h3>

    <p>【普通 p 标签内】：即使代码里打了空格和换行，浏览器也会把它们合并为一个空格：</p>
    <p>
        第一行（缩进 4 空格）
        第二行
    </p>

    <p>【pre 标签内】：原本的换行、缩进和多个空格都会原样保留：</p>
    <pre>
        def greet(name):
            # 这里的缩进和换行完全不会被压缩
            message = "Hello, " + name
            return message
    </pre>
</body>
</html>
