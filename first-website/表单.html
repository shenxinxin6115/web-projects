<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表单</title>
</head>
<body>
    <form action="https://www.baidu.com/s" method="get" target="_blank">
        <span>搜索：</span><input type="text" name="wd" >
        <button>去百度搜索</button>
    </form>
    <hr>
    <form action="https://测试" target="_blank">
        账号：<input type="text" name="account" value="zhangsan" maxlength="10"><br>
        密码：<input type="password" name="pwd" value="123456" maxlength="6"><br>
        性别：<input type="radio" name="sex" value="female" checked>女
        <input type="radio" name="sex" value="male">男<br>
        爱好：<input type="checkbox" name="hobby" value="smoke" checked>抽烟
        <input type="checkbox" name="hobby" value="drink">喝酒
        <input type="checkbox" name="hobby" value="perm" checked>烫头<br>
        其他：<textarea name="msg" cols="22" rows="5" value="请输入其他信息..."></textarea><br>
        籍贯：<select name="from">
            <option value="黑">黑龙江</option>
            <option value="辽">辽宁</option>
            <option value="吉">吉林</option>
            <option value="粤" selected>广东</option>
        </select><br>
        <button type="submit">确认</button>
        <button type="reset">重置</button>
        <button type="button">检测账号是否被注册</button>
        <input type="submit" value="提交">
        <input type="reset" value="重置">
        <input type="button" value="检测账号是否被注册" disabled>
    </form>
</body>
</html>
