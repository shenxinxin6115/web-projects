<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表格跨行跨列</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="0">
        <caption>课程表</caption>
        <thead>
            <tr>
                <th height="30">项目</th>
                <th colspan="5">上课</th>
                <th colspan="2">活动与休息</th>
            </tr>
            <tr>
                <th width="80" height="30">星期</th>
                <th width="80">星期一</th>
                <th width="80">星期二</th>
                <th width="80">星期三</th>
                <th width="80">星期四</th>
                <th width="80">星期五</th>
                <th width="80">星期六</th>
                <th width="80">星期日</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4" height="30">上午</td>
                <td>语文</td>
                <td>数学</td>
                <td>英语</td>
                <td>英语</td>
                <td>物理</td>
                <td>数学竞赛</td>
                <td rowspan="4">休息</td>
            </tr>
            <tr>
                <td height="30">数学</td>
                <td>语文</td>
                <td>化学</td>
                <td>物理</td>
                <td>英语</td>
                <td>篮球比赛</td>
            </tr>
            <tr>
                <td height="30">化学</td>
                <td>语文</td>
                <td>体育</td>
                <td>历史</td>
                <td>地理</td>
                <td>每周一考</td>
            </tr>
            <tr>
                <td height="30">体育</td>
                <td>化学</td>
                <td>语文</td>
                <td>数学</td>
                <td>英语</td>
                <td>社会实践</td>
            </tr>
            <tr>
                <td rowspan="2" height="30">下午</td>
                <td >语文</td>
                <td>英语</td>
                <td>数学</td>
                <td>物理</td>
                <td>数学</td>
                <td>英语角</td>
                <td rowspan="2">休息</td>
            </tr>
            <tr>
                <td height="30">化学</td>
                <td>物理</td>
                <td>地理</td>
                <td>生物</td>
                <td>体育</td>
                <td>自由活动</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
